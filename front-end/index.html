<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Password Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section id="loginPage" class="card">
      <h1>🔐 Cloud Password Manager</h1>
      <p class="muted">Securely manage your passwords.</p>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Master password">
      <button onclick="login()">Login</button>
      <p>New user? <a href="#" onclick="showRegister()">Create account</a></p>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="registerPage" class="card hidden">
      <h1>Create Account</h1>
      <input id="registerName" placeholder="Name">
      <input id="registerEmail" type="email" placeholder="Email">
      <input id="registerPassword" type="password" placeholder="Master password">
      <button onclick="register()">Register</button>
      <p>Already registered? <a href="#" onclick="showLogin()">Login</a></p>
      <p id="registerMessage" class="message"></p>
    </section>

    <section id="dashboardPage" class="hidden">
      <header class="topbar">
        <div>
          <h1>My Password Vault</h1>
          <p id="welcome"></p>
        </div>
        <button class="secondary" onclick="logout()">Logout</button>
      </header>

      <section class="card">
        <div class="toolbar">
          <input id="search" placeholder="Search website..." oninput="loadPasswords()">
          <button onclick="openAddForm()">+ Add Password</button>
        </div>
        <div id="passwordList"></div>
      </section>

      <section id="passwordForm" class="card hidden">
        <h2 id="formTitle">Add Password</h2>
        <input id="site" placeholder="Website / Service">
        <input id="username" placeholder="Username / Email">
        <div class="password-row">
          <input id="vaultPassword" type="password" placeholder="Password">
          <button class="secondary" onclick="generatePassword()">Generate</button>
        </div>
        <textarea id="notes" placeholder="Notes (optional)"></textarea>
        <button onclick="savePassword()">Save</button>
        <button class="secondary" onclick="closeForm()">Cancel</button>
        <p id="formMessage" class="message"></p>
      </section>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
